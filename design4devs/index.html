<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="favicon" href="/logo-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" id="theme-color-meta" />
    
    <!-- Favicon switching script - must be in head for instant load -->
    <script>
      (function() {
        const favicon = document.getElementById('favicon');
        const themeColorMeta = document.getElementById('theme-color-meta');
        
        function updateFavicon() {
          const isDark = localStorage.getItem('darkMode') === 'true' || 
                        (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          
          if (favicon) {
            favicon.href = isDark ? '/logo-dark.png' : '/logo-light.png';
          }
          
          if (themeColorMeta) {
            themeColorMeta.content = isDark ? '#111827' : '#2563eb';
          }
        }
        
        updateFavicon();
        
        // Listen for changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
        window.addEventListener('storage', updateFavicon);
        
        // Listen for manual dark mode toggle
        const observer = new MutationObserver(updateFavicon);
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class']
        });
      })();
    </script>
    
    <!-- Primary Meta Tags -->
