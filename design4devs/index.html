<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/png" id="favicon" href="/logo-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" id="theme-color-meta" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Design for Developers",
        "url": "https://design.fundwave.dev/",
        "description": "Understand UX design with interactive guides",
        "publisher": {
          "@type": "Organization",
          "name": "Fundwave",
          "logo": {
            "@type": "ImageObject",
            "url": "https://design.fundwave.dev/favicons/android-chrome-512x512.png"
          }
        }
      }
    </script>
    
    <script>
      (function() {
        const favicon = document.getElementById('favicon');
        const themeColorMeta = document.getElementById('theme-color-meta');

        function updateFavicon() {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (favicon) {
            favicon.href = isDark ? '/logo-dark.png' : '/logo-light.png';
          }

          if (themeColorMeta) {
            themeColorMeta.content = isDark ? '#111827' : '#2563eb';
          }
        }

        updateFavicon();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Design for Developers | Learn UX Design</title>
    <meta name="title" content="Design for Developers | Learn UX Design" />
    <meta name="description" content="Understand UX design with interactive guides" />
    <meta name="keywords" content="design for developers, UX design, design systems, design tokens, typography, color theory, UI design, web design, usability, Hick's Law, Fitts's Law, Jakob's Law" />
    <meta name="author" content="Fundwave" />
    <meta name="copyright" content="Fundwave" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://design.fundwave.dev/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://design.fundwave.dev/" />
    <meta property="og:title" content="Design for Developers" />
    <meta property="og:description" content="Understand UX design with interactive guides" />
    <meta property="og:site_name" content="Design for Developers" />
    <meta property="og:image" content="https://design.fundwave.dev/hero.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://design.fundwave.dev/" />
    <meta name="twitter:title" content="Design for Developers" />
    <meta name="twitter:description" content="Understand UX design with interactive guides" />
    <meta name="twitter:image" content="https://design.fundwave.dev/hero.png" />
    
    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="google" content="notranslate" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="320" />
    
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Design for Developers" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
